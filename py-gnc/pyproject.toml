[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cesium-gnc"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "pandas"]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff==0.17.3",
    "tqdm",
    "ipykernel",
    "plotly",
    "kaleido>=1",
    "juliandate",
    "lamberthub",
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["cesium", "cesium.*", "csim", "csim.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not slow'"
markers = [
    "slow: long-running fixed-step integration tests",
]

[tool.coverage.run]
source_pkgs = ["cesium", "csim"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true

[tool.coverage.lcov]
output = "lcov.info"

[tool.ruff.lint]
extend-select = ["I", "F403", "RUF022"]
ignore = ["E741", "RUF013", "B008"]
