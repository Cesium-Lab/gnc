
name: Simulation Tests

on:
  push:
  pull_request:

jobs:
  test-everything:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: py-gnc/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./py-gnc[dev]"

      - name: Run all simulation tests
        run: |
          python -m pytest py-gnc -v -o addopts= -m ""

  lint-everything:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: py-gnc/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./py-gnc[dev]"

      - name: Settings
        # run: python -m ruff check py-gnc/cesium/planning/__init__.py --show-settings
        run: python -m ruff --version

      - name: Ruff lint
        run: python -m ruff check ./py-gnc

      - name: Ruff format
        run: python -m ruff format --check ./py-gnc
